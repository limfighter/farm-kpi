name: Audit and unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Verify 51-source crop exploration dataset and offline page
        run: python scripts/refresh_crop_discovery.py --check
      - name: Reaudit derived ASOS annual data
        run: python -m farm_strategy.audit --annual data/processed/annual_asos_jeonju_2006_2025.csv --metadata data/metadata/asos_v10_archive_audit.json
      - name: Validate existing simulation input
        run: farm-strategy validate
      - name: Validate empty private evidence template (no imported numbers)
        run: farm-strategy evidence-check --file data/templates/private_evidence_TEMPLATE.csv
      - name: Produce paired model-only screening
        run: |
          farm-strategy compare --seed 42 --paths 300 --stress-matrix --output output/screening-model-only.json --csv output/screening-model-only.csv
      - name: Check dashboard snapshot and publish offline HTML
        run: |
          python scripts/build_dashboard.py --csv output/screening-model-only.csv --html dashboard/index.html --check
          python scripts/build_dashboard.py --csv output/screening-model-only.csv --html dashboard/index.html --output output/farm-kpi-dashboard.html
      - name: Upload non-validated screening outputs
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-model-only-comparison
          path: |
            output/screening-model-only.json
            output/screening-model-only.csv
            output/farm-kpi-dashboard.html
          retention-days: 14
