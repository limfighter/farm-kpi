name: Audit and unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Reaudit derived ASOS annual data
        run: python -m farm_strategy.audit --annual data/processed/annual_asos_jeonju_2006_2025.csv --metadata data/metadata/asos_v10_archive_audit.json
      - name: Validate existing simulation input
        run: farm-strategy validate
      - name: Produce paired model-only screening
        run: |
          farm-strategy compare --seed 42 --paths 300 --stress-matrix --output output/screening-model-only.json --csv output/screening-model-only.csv
      - name: Upload non-validated screening outputs
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-model-only-comparison
          path: |
            output/screening-model-only.json
            output/screening-model-only.csv
          retention-days: 14
