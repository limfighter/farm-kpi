name: Audit and unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Check docs catalog, relative links and ADR records
        run: python scripts/check_docs.py --check
      - name: Verify 51-source crop exploration dataset and offline page
        run: python scripts/refresh_crop_discovery.py --check
      - name: Check complete 51-crop editable workflow explorer
        run: python scripts/build_crop_universe.py --check
      - name: Verify locked 2024 RDA PDF transcription registry
        run: python scripts/verify_rda_pdf_source.py --check
      - name: Verify RDA national/regional publication registry and 2024-only long-form observations
        run: python scripts/check_crop_income_history.py --check
      - name: Validate off-survey discovery registry (pending is not verified)
        run: python scripts/check_off_survey_candidates.py --check
      - name: Validate partial 2022-2023 official RDA web observations
        run: python scripts/check_rda_web_sample.py --check
      - name: Ensure offline source coverage dashboard is reproducible
        run: python scripts/build_rda_web_sample_board.py --check
      - name: Validate empty non-identifying private parcel intake
        run: farm-strategy site-check --file data/templates/private_site_intake_TEMPLATE.json --output output/site-status-redacted.json
      - name: Check all 51 parcel-readiness gates and offline HTML
        run: python scripts/build_feasibility.py --check
      - name: Reaudit derived ASOS annual data
        run: python -m farm_strategy.audit --annual data/processed/annual_asos_jeonju_2006_2025.csv --metadata data/metadata/asos_v10_archive_audit.json
      - name: Simulate workflow based crop-facility options (synthetic inputs only)
        run: |
          python scripts/compare_workflows.py --input data/templates/workflow_scenarios_SYNTHETIC.json --output output/workflow-example.json --html output/workflow-example.html
      - name: Upload illustrative workflow comparison HTML
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-workflow-experiment-not-validated
          path: |
            output/workflow-example.json
            output/workflow-example.html
          retention-days: 14
      - name: Upload offline all-crop browser
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-all-crop-workflow-editor
          path: dashboard/universe/index.html
          retention-days: 14
      - name: Generate synthetic 3-year crop and facility lifecycle cashflow
        run: |
          python scripts/compare_multiyear.py --input data/templates/multiyear_scenarios_SYNTHETIC.json --output output/multiyear-model-only.json --html output/multiyear-model-only.html
      - name: Upload synthetic 3-year lifecycle report
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-multiyear-experiment-not-validated
          path: |
            output/multiyear-model-only.json
            output/multiyear-model-only.html
          retention-days: 14
      - name: Audit practical farm input gaps and conditional advantages
        run: |
          python -m farm_strategy.operational_factors --check --output output/decision-factor-audit.json --html output/decision-factor-audit.html
      - name: Upload farm realism audit (not field feasibility)
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-realism-variable-audit-not-field-validation
          path: |
            output/decision-factor-audit.json
            output/decision-factor-audit.html
          retention-days: 14
      - name: Quantify incremental crop/facility operating advantages with synthetic paired data
        run: |
          python scripts/compare_options.py --input data/templates/multiyear_scenarios_SYNTHETIC.json --output output/paired-option-deltas.json --html output/paired-option-deltas.html
      - name: Upload matched-case option tradeoffs (synthetic only)
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-paired-option-tradeoffs-synthetic
          path: |
            output/paired-option-deltas.json
            output/paired-option-deltas.html
          retention-days: 14
      - name: Simulate weekly labor peaks and grade-specific cash (synthetic)
        run: |
          python scripts/assess_execution.py --input data/templates/execution_detail_SYNTHETIC.json --output output/execution-detail-example.json --html output/execution-detail-example.html
      - name: Upload synthetic labor and grade details
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-weekly-labor-grade-experiment
          path: |
            output/execution-detail-example.json
            output/execution-detail-example.html
          retention-days: 14
      - name: Simulate multi-crop plots, shared inputs and explicit credit cash
        run: |
          python scripts/compare_portfolio.py --input data/templates/portfolio_SYNTHETIC.json --output output/portfolio-synthetic.json --html output/portfolio-synthetic.html
      - name: Upload synthetic multi-crop portfolio report
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-multicrop-portfolio-synthetic
          path: |
            output/portfolio-synthetic.json
            output/portfolio-synthetic.html
          retention-days: 14
      - name: Validate daily crop-stage inputs, peak pump/power and equal-principal amortization
        run: |
          python scripts/assess_physical_operations.py --input data/templates/physical_operations_SYNTHETIC.json --output output/physical-operations.json --html output/physical-operations.html
      - name: Upload synthetic daily operations physical capacity preview
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-daily-physical-and-finance-model-only
          path: |
            output/physical-operations.json
            output/physical-operations.html
          retention-days: 14
      - name: Validate existing simulation input
        run: farm-strategy validate
      - name: Validate empty private evidence template (no imported numbers)
        run: farm-strategy evidence-check --file data/templates/private_evidence_TEMPLATE.csv
      - name: Produce paired model-only screening
        run: |
          farm-strategy compare --seed 42 --paths 300 --stress-matrix --output output/screening-model-only.json --csv output/screening-model-only.csv
      - name: Check dashboard snapshot and publish offline HTML
        run: |
          python scripts/build_dashboard.py --csv output/screening-model-only.csv --html dashboard/index.html --check
          python scripts/build_dashboard.py --csv output/screening-model-only.csv --html dashboard/index.html --output output/farm-kpi-dashboard.html
      - name: Upload non-validated screening outputs
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-model-only-comparison
          path: |
            output/screening-model-only.json
            output/screening-model-only.csv
            output/farm-kpi-dashboard.html
          retention-days: 14
      - name: Publish non-sensitive crop readiness board
        uses: actions/upload-artifact@v4
        with:
          name: farm-kpi-51-crop-readiness
          path: |
            dashboard/feasibility/index.html
            data/derived/crop_readiness_51.csv
          retention-days: 14
