[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "farm-kpi-strategy"
version = "0.1.0"
requires-python = ">=3.10"
description = "Risk-aware Jeonju agricultural planning; scenario outputs are not investment forecasts"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7"]
[project.scripts]
farm-strategy = "farm_strategy.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
